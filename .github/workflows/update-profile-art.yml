name: Update Profile Art

on:
  schedule:
    # Runs daily at 06:17 UTC — staggered to avoid GitHub Actions peak load
    - cron: "17 6 * * *"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Prevent multiple concurrent runs
concurrency:
  group: update-profile-art
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  heatmap:
    name: Refresh Contribution Heatmap
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "scripts/requirements-ci.txt"

      - name: Install CI dependencies
        run: |
          pip install --upgrade pip
          pip install -r scripts/requirements-ci.txt

      - name: Fetch contribution data
        run: python scripts/fetch_contributions.py

      - name: Render heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          skip_dirty_check: false
          skip_fetch: false
